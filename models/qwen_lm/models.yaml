      INT8 ConvRot: {file: Qwen3.5-9B-abliterated_int8_convrot.safetensors, url: "https://huggingface.co/beycanai/Qwen-LM/resolve/main/Qwen3.5-9B-abliterated_int8_convrot.safetensors"}

