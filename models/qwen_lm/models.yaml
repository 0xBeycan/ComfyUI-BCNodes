# The built-in Qwen LM catalog. Schema: models/common/lm/catalog.py.
# A models.yaml in a Qwen-LM models folder (ComfyUI/models/Qwen-LM/models.yaml) overrides or extends it:
# a field it gives replaces the field here, a precision it names replaces or adds that precision.
#
# Sampling defaults are the official ones per mode, from the model cards (each defaults block names its
# source); do_sample is true for all (generation_config do_sample true / the card's greedy=false). The
# derivatives (abliterated builds) keep their base model's sets. mtp: auto lets core pick the draft depth on a file with an MTP head.
# Files: https://huggingface.co/beycanai/Qwen-LM (public, no token).

models:
  Qwen3.5-4B:
    template: qwen3.5
    thinking: true
    mtp: true
    defaults:
      # source: Qwen/Qwen3.5-9B README lines 833-836 (general tasks; the 4B card is identical)
      thinking_off: {do_sample: true, temperature: 0.7, top_p: 0.8, top_k: 20, min_p: 0.0, presence_penalty: 1.5, repetition_penalty: 1.0, mtp: auto}
      thinking_on: {do_sample: true, temperature: 1.0, top_p: 0.95, top_k: 20, min_p: 0.0, presence_penalty: 1.5, repetition_penalty: 1.0, mtp: auto}
    precisions:
      BF16: {file: Qwen3.5-4B_bf16.safetensors, url: "https://huggingface.co/beycanai/Qwen-LM/resolve/main/Qwen3.5-4B_bf16.safetensors"}
      INT8 ConvRot: {file: Qwen3.5-4B_int8_convrot.safetensors, url: "https://huggingface.co/beycanai/Qwen-LM/resolve/main/Qwen3.5-4B_int8_convrot.safetensors"}

