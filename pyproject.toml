[project]
name = "comfyui-bcnodes"
version = "2.0.0"
description = "Utility nodes for ComfyUI, mostly for image work: prepare, generate, refine, check and save images, and keep workflows simple. Every node is built to be fast and light on RAM and VRAM."
authors = [{ name = "0xBeycan" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
# The four packages the pack uses that ComfyUI does not ship (the same as requirements.txt): postfx the
# PostFx nodes; caption-audit the Caption Audit node; opencv-python MaskGrow, Mask Fill Holes, Image
# Quality Gate and the PostFx mask resize; anthropic (Anthropic's official SDK) Claude and Claude Chat.
# Everything else ships with ComfyUI; the optional packages are listed in README.md.
dependencies = ["postfx>=1.1.0", "caption-audit>=1.3", "opencv-python", "anthropic>=2.12"]

[project.urls]
Homepage = "https://github.com/0xBeycan/ComfyUI-BCNodes"
Repository = "https://github.com/0xBeycan/ComfyUI-BCNodes"
"Bug Tracker" = "https://github.com/0xBeycan/ComfyUI-BCNodes/issues"

# ComfyUI Registry metadata (https://docs.comfy.org/registry/publishing)
[tool.comfy]
PublisherId = "beycanai"
DisplayName = "ComfyUI-BCNodes"
Icon = ""
